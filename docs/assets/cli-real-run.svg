<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">HCheck 真实命令输出展示</title>
  <desc id="desc">基于公开非生产 fixture 的实际 CLI 输出排版。左侧展示预期的权限 BLOCKER 和退出码 1，右侧展示干净 fixture 通过门禁和退出码 0。</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'PingFang SC', monospace; }
    .muted { fill: #a8c0d8; } .body { fill: #dceaf7; } .teal { fill: #5eead4; } .rose { fill: #fb7185; }
  </style>
  <rect width="1600" height="1120" fill="#08111f"/>
  <rect x="0" y="0" width="1600" height="7" fill="#5eead4"/>
  <text x="82" y="88" class="sans teal" font-size="18" font-weight="700" letter-spacing="3">HCHECK · 可复现的本地 CLI 输出</text>
  <text x="82" y="150" class="sans body" font-size="48" font-weight="750">真实运行展示：发现问题，也确认没有问题</text>
  <text x="82" y="192" class="sans muted" font-size="21">基于公开、非生产 fixture 的实际命令输出 · Node.js v24.18.0</text>
  <rect x="82" y="232" width="1436" height="76" rx="14" fill="#0d1b2a" stroke="#33516d"/>
  <text x="108" y="267" class="sans muted" font-size="17">真实文本输出的静态排版展示图，不是设备、AGC 或生产项目画面。</text>
  <text x="108" y="292" class="sans muted" font-size="17">所有命令、退出码和输入均可在本仓库独立复验。</text>

  <rect x="82" y="346" width="696" height="642" rx="18" fill="#0b1726" stroke="#5c3141" stroke-width="2"/>
  <rect x="82" y="346" width="696" height="112" rx="18" fill="#111b2b"/>
  <rect x="82" y="426" width="696" height="32" fill="#111b2b"/>
  <text x="110" y="386" class="sans rose" font-size="16" font-weight="800" letter-spacing="2">EXPECTED BLOCKER · EXIT 1</text>
  <text x="110" y="426" class="sans body" font-size="29" font-weight="750">缺少最小权限</text>
  <text x="110" y="494" class="mono muted" font-size="13">node packages/cli/dist/index.js scan fixtures/missing-permission</text>
  <text x="110" y="517" class="mono muted" font-size="13">--format terminal --fail-on high --confidence probable</text>
  <rect x="110" y="542" width="640" height="412" rx="12" fill="#020812"/>
  <text x="134" y="575" class="mono body" font-size="15">鸿鉴 HCheck 扫描报告</text>
  <text x="134" y="601" class="mono body" font-size="15">运行 ID：run-18fc6601-24c5-45f2-b835-ff589b82868e</text>
  <text x="134" y="627" class="mono body" font-size="15">模式：quick</text>
  <text x="134" y="653" class="mono body" font-size="15">项目：com.hcheck.fixture.missingpermission</text>
  <text x="134" y="679" class="mono body" font-size="15">规则包：hcheck-p0@0.6.0</text>
  <text x="134" y="705" class="mono body" font-size="15">完整性：COMPLETE    门禁：FAIL    问题总数：1</text>
  <text x="134" y="731" class="mono rose" font-size="15">BLOCKER：1  HIGH：0  MEDIUM：0  LOW：0  INFO：0</text>
  <text x="134" y="770" class="mono rose" font-size="15">[BLOCKER] HOS-PERM-001 使用受限 API 但未声明对应权限</text>
  <text x="134" y="798" class="mono body" font-size="14">位置：entry/src/main/ets/Index.ets:4:10</text>
  <text x="134" y="826" class="mono body" font-size="14">源码调用 geoLocationManager.getCurrentLocation，</text>
  <text x="134" y="850" class="mono body" font-size="14">但模块未声明 ohos.permission.APPROXIMATELY_LOCATION。</text>
  <text x="134" y="889" class="mono body" font-size="14">修复：根据实际业务需要声明权限；不需要则移除调用。</text>
  <text x="134" y="926" class="mono rose" font-size="15">blocker_exit=1</text>

  <rect x="822" y="346" width="696" height="642" rx="18" fill="#0b1726" stroke="#2d746d" stroke-width="2"/>
  <rect x="822" y="346" width="696" height="112" rx="18" fill="#111b2b"/>
  <rect x="822" y="426" width="696" height="32" fill="#111b2b"/>
  <text x="850" y="386" class="sans teal" font-size="16" font-weight="800" letter-spacing="2">CLEAN FIXTURE · EXIT 0</text>
  <text x="850" y="426" class="sans body" font-size="29" font-weight="750">干净工程通过门禁</text>
  <text x="850" y="494" class="mono muted" font-size="13">node packages/cli/dist/index.js scan fixtures/clean-stage-app</text>
  <text x="850" y="517" class="mono muted" font-size="13">--format terminal</text>
  <rect x="850" y="542" width="640" height="412" rx="12" fill="#020812"/>
  <text x="874" y="575" class="mono body" font-size="15">鸿鉴 HCheck 扫描报告</text>
  <text x="874" y="601" class="mono body" font-size="15">运行 ID：run-e00717e8-c8f0-4582-bcf1-54fbc76d67eb</text>
  <text x="874" y="627" class="mono body" font-size="15">模式：quick</text>
  <text x="874" y="653" class="mono body" font-size="15">项目：com.hcheck.fixture.clean</text>
  <text x="874" y="679" class="mono body" font-size="15">规则包：hcheck-p0@0.6.0</text>
  <text x="874" y="705" class="mono body" font-size="15">完整性：COMPLETE    门禁：PASS    问题总数：0</text>
  <text x="874" y="731" class="mono teal" font-size="15">BLOCKER：0  HIGH：0  MEDIUM：0  LOW：0  INFO：0</text>
  <text x="874" y="770" class="mono body" font-size="15">未发现满足当前扫描范围的问题。</text>
  <text x="874" y="926" class="mono teal" font-size="15">clean_exit=0</text>
  <text x="82" y="1056" class="sans muted" font-size="17">复现前执行 pnpm build；所有 fixture 均为公开的非生产测试数据。</text>
</svg>
